name: Atualizar dados do PortWatch

# Puxa os dados públicos do PortWatch VI 4 vezes por dia e salva em data/.
# Também dá pra rodar à mão em Actions › "Atualizar dados do PortWatch" › Run workflow.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Puxar dados do PortWatch
        run: node scripts/atualizar-dados.mjs
      - name: Conferir os dados
        run: node scripts/validar-dados.mjs && node scripts/testar-motor.mjs
      - name: Salvar se algo mudou
        run: |
          if git diff --quiet -- data/; then
            echo "Nada novo no PortWatch."
            exit 0
          fi
          git config user.name "roda-o-vi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Dados do PortWatch: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
