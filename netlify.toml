# Site estático + funções do mural.
[build]
  # Confere os dados, roda os testes e monta só os arquivos do site em dist/
  command = "node scripts/validar-dados.mjs && node scripts/testar-motor.mjs && node scripts/montar-site.mjs"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Outros sites podem usar os dados, o motor e o widget.
[[headers]]
  for = "/data/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/i18n/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/lib/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/embed/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"
